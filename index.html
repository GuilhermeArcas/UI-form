<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <title>Formulário Cunt</title>
</head>
<body>
    <div class="main-container">
        <form class="form">
            <div class="form-left">
                <div class="form-group">
                    <label for="username">Full Name:</label>
                    <input type="text" id="username" name="name" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Your email" aria-required="true" aria-invalid="false" aria-describedby="dica-email">
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Your password">
                    <span><i class="bi bi-eye-fill"></i></span>
                </div>

                    <div class="form-group">
                        <label for="password">Confirm your password:</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password">
                    </div>

                <button>Update Profile</button>
                </div>

                <div class="form-right">
                <div class="form-right">
                    <div class="progress-container">
                        <div class="circular-progress"
                        role="progressbar"
                        aria-valuenow="65"
                        aria-valuemin="0"
                        aria-valuemax="100">
                            <span class="progress-value">65%</span>
                    </div>
                        <h3>Profile Completeness</h3>
                    </div>
                    <div class="checklist-card">
                        <ul>
                            <li class="done">Create Account</li>
                            <li class="done">Update Roadmap Progress</li>
                            <li class="done">Setup Public Profile</li>
                            <li>Complete your first project</li>
                            <li>Invite your friends</li>
                        </ul>
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>
<link rel="stylesheet" href="style.css">
</html>
